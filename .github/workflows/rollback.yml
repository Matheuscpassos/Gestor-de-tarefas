name: Rollback

# Rollback manual: reimplanta uma versão anterior já publicada no GHCR no
# ambiente de homologação (simulado) e confirma que a versão voltou.
# Como usar: Actions → Rollback → Run workflow → informe a versão (ex.: 1.0.0)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (tag da imagem) para restaurar. Ex.: 1.0.0 ou sha-abc1234"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    name: Rollback em staging para ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reimplantar a versão anterior
        env:
          VERSION: ${{ inputs.version }}
          APP_ENV: staging
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          export IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          export IMAGE_TAG="$VERSION"
          docker compose pull          # falha aqui se a versão não existir
          docker compose up -d --no-build

      - name: Smoke test (confirma que a versão restaurada está no ar)
        run: bash scripts/smoke-test.sh http://localhost:3000 "${{ inputs.version }}"

      - name: Resumo
        if: success()
        run: |
          {
            echo "### ⏪ Rollback concluído"
            echo "- Versão restaurada: \`${{ inputs.version }}\`"
            echo "- Acionado por: ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
